[project]
name = "platform-profile"
version = "0.1.0"
description = "A git-tracked knowledge profile of what a company publicly says, kept current and diffed, so AI agents cite it instead of guessing"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nuno Ferreira" }]
requires-python = ">=3.12"
keywords = ["knowledge-base", "web-crawler", "ai-agents", "claude-code", "go-to-market"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
platform-profile = "platform_profile.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
